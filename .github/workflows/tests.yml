# CI — protects main: unit tests + production build + committed-bundle freshness.
# Runs on every push and pull request targeting main. All three steps must
# pass; a red run means the change would ship a regression to GitHub Pages.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Au niveau du JOB : un `if:` d'étape ne voit PAS le `env:` de sa
    # propre étape (il est évalué avant). C'est la seule portée qui
    # permet de sauter proprement l'envoi quand le secret est absent.
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # Node >= 18 is required for the built-in test runner (node --test)
      # and the global CompressionStream used by the backup-code tests.
      # 22 matches the maintainer's local version.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (esbuild + Biome, the only devDependencies)
        run: npm ci

      - name: Unit tests (node --test)
        run: npm test

      # DEUX étapes de lint, et la différence entre elles est le sujet.
      #
      # BLOQUANTE — les DEUX erreurs qu'un découpage de module produit,
      # symétriques l'une de l'autre :
      #
      #   · symbole UTILISÉ SANS ÊTRE IMPORTÉ (noUndeclaredVariables).
      #     Invisible partout ailleurs : `npm run build` passe, `npm test`
      #     passe, parce qu'esbuild en --format=iife met tout dans une
      #     portée unique où un symbole manquant reste visible. Seuls les
      #     modules bruts (index-dev.html) lèvent un ReferenceError. Le
      #     découpage de badges.js a laissé CINQ symboles ainsi, dont deux
      #     qu'aucune vérification manuelle n'a vus.
      #
      #   · symbole IMPORTÉ SANS ÊTRE UTILISÉ (noUnusedImports). Le même
      #     découpage en a laissé DIX-NEUF, et le premier garde ne pouvait
      #     pas les voir — il regardait dans l'autre sens. Codacy en a
      #     signalé onze ; Biome a trouvé les huit autres.
      #
      # Pourquoi noUnusedImports et pas noUnusedVariables : cette dernière
      # compte 56 constats, dont 54 sont des `catch(e)` muets — du bruit
      # hérité qui rendrait l'étape rouge en permanence. Les imports, eux,
      # sont à ZÉRO : l'étape peut être bloquante sans jamais mentir.
      - name: Symboles non déclarés et imports morts (bloquant)
        run: npm run lint

      # NON BLOQUANTE — tout le reste. ~99 constats hérités de ~40
      # versions : locals morts, catch muets, spécificité CSS. Une étape
      # rouge en permanence apprend à ignorer le CI ; celle-ci informe,
      # l'autre garde. Basculer en bloquant le jour où le compte atteint 0.
      - name: Lint complet (Biome — informatif)
        run: |
          npx biome check . || echo "::notice title=Biome::backlog connu et assumé (dead locals, catch muets, spécificité CSS) — non bloquant"
        continue-on-error: true

      # ── Couverture → Codacy ─────────────────────────────────────
      # Reporter LCOV NATIF de Node : aucune dépendance ajoutée, ce qui
      # est la règle du dépôt. Exclut les tests eux-mêmes, l'artefact de
      # build, les outils de dev et les fichiers de DONNÉES (traductions,
      # données embarquées, descriptions de cartes, config cloud) : leur
      # inclure gonflerait le dénominateur avec des littéraux.
      #
      # AUCUN SEUIL n'est imposé. Le chiffre mesure la tranche
      # « sans navigateur » de l'app — pas l'app. Le publier comme une
      # note serait trompeur ; le remonter comme SIGNAL de tendance ne
      # l'est pas. C'est pour ça qu'il monte ici sans bloquer la CI.
      - name: Couverture (reporter LCOV natif)
        run: npm run test:cov

      # Sans ce contrôle, un LCOV vide ou absent monterait silencieusement
      # à Codacy et la jauge afficherait 0 % au lieu de rien.
      - name: Le rapport de couverture existe et n'est pas vide
        run: |
          test -s coverage/lcov.info || {
            echo '::error::coverage/lcov.info absent ou vide — le reporter n a rien produit.'
            exit 1
          }
          echo "LCOV : $(grep -c '^SF:' coverage/lcov.info) fichiers, $(wc -l < coverage/lcov.info) lignes"

      # Le secret CODACY_PROJECT_TOKEN se crée dans Codacy :
      # Repository > Settings > Coverage > Project API token, puis se
      # colle dans GitHub : Settings > Secrets and variables > Actions.
      # Sans le secret, l'étape est SAUTÉE — un fork ou une PR externe
      # ne fait pas échouer la CI pour une variable qu'il ne peut pas
      # avoir.
      - name: Envoi de la couverture à Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
            --force-coverage-parser lcov -r coverage/lcov.info
        continue-on-error: true

      - name: Production build (esbuild)
        run: npm run build

      # app.bundle.js is a COMMITTED artifact (GitHub Pages runs no build):
      # a stale bundle means the live app doesn't match the sources. esbuild
      # is pinned by package-lock.json and its output is deterministic, so
      # rebuilding in CI and diffing is reliable. If this fails: run
      # `npm run build` locally and commit the regenerated bundle.
      - name: Committed bundle is up to date
        run: |
          git diff --exit-code -- app.bundle.js app.bundle.js.map || {
            echo '::error::app.bundle.js is stale — run `npm run build` and commit the regenerated bundle.'
            exit 1
          }
