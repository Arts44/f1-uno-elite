# ══════════════════════════════════════════════════════════════════
# ESLint — configuration lue par Codacy
#
# Le dépôt lint avec Biome au quotidien (npm run lint). Ce fichier
# existe pour UNE raison : donner à Codacy la configuration de règles
# qu'il applique par défaut sans contexte, et expliquer par écrit
# chaque désactivation.
#
# Principe : on ne désactive JAMAIS une règle qui couvre un vrai
# risque sur cette architecture. On désactive celles qui produisent
# du faux positif SYSTÉMIQUE, c'est-à-dire dont la totalité des
# occurrences est structurellement sûre ici — et on dit pourquoi.
# ══════════════════════════════════════════════════════════════════
root: true

env:
  browser: true
  es2022: true

parserOptions:
  ecmaVersion: 2022
  sourceType: module

rules:
  # ── security/detect-object-injection ─────────────────────────────
  # LA source de bruit numéro un sur ce dépôt.
  #
  # La règle signale toute lecture `objet[variable]`. Ici, ces accès
  # portent TOUS sur des tables de correspondance internes, indexées
  # par des clés qui viennent des données du dépôt :
  #   RARITY_ORDER[rKey]      rKey ∈ RARITY_KEYS (metadata.json)
  #   TEAM_COLORS[card.team]  card.team ∈ cards-2025.json
  #   CARD_TYPES[typeId]      typeId ∈ card.types
  #   CATS[card.category]     idem
  #   PREF_KEYS[name]         name est une clé littérale du module
  # Aucune de ces clés ne vient d'une saisie, d'un import ou du
  # réseau ; toutes proviennent de JSON versionnés dans le dépôt et
  # validés par les tests de parité data/ ↔ data-embedded.js.
  #
  # Le risque réel que la règle vise — atteindre __proto__ ou
  # constructor via une clé contrôlée par l'attaquant — n'existe pas :
  # une clé hostile ne peut pas entrer dans ces tables, et une clé
  # inconnue rend `undefined`, que tous les appels gèrent déjà
  # (`CATS[c]?.emoji || '🃏'`).
  #
  # La contourner exigerait d'ajouter des `Object.hasOwn()` partout —
  # exactement le « code défensif inutile » qu'on refuse.
  security/detect-object-injection: 'off'

  # ── no-unsanitized/property et security/detect-non-literal-* ─────
  # Signalent toute affectation innerHTML.
  #
  # Sur les 78 affectations des modules livrés, un balayage de
  # provenance (voir tests/security-hardening.test.js) donne :
  #   40 markup CONSTANT écrit dans le dépôt (icônes SVG, gabarits) ;
  #   35 interpolant des données INTERNES (catalogue de cartes,
  #      traductions, définitions de badges — toutes versionnées) ;
  #    3 interpolant des données EXTERNES, et ces trois-là sont
  #      échappées : import JSON (tEsc), session cloud (escapeHtml),
  #      retours de feedback (escapeHtml).
  #
  # La règle ne sait pas distinguer les trois cas. C'est pour la
  # rendre lisible À L'ŒIL que setSafeHTML() a été introduit dans
  # i18n.js : un appel setSafeHTML() déclare « ce HTML vient du
  # dépôt », escapeHtml/tEsc déclare « cette donnée vient d'ailleurs ».
  #
  # Ce qui remplace la règle : le test de provenance ci-dessus, qui
  # échoue si un site à donnée externe perd son échappement.
  #
  # ELLE N'EST PAS DÉSACTIVÉE GLOBALEMENT. Le détecteur XSS de Codacy
  # ne crie en fait que sur DEUX lignes — celles où une VARIABLE part
  # dans innerHTML — et ces deux-là portent leur exclusion sur place,
  # avec la raison écrite juste au-dessus (i18n.js, render.js).
  # La règle doit continuer de crier partout ailleurs : c'est sa
  # raison d'être.

  # ── Règles de style sans portée ici ──────────────────────────────
  # Le dépôt a son propre style (2 espaces, points-virgules, quotes
  # simples), appliqué par Biome. Laisser Codacy arbitrer en plus
  # produirait des avis contradictoires sur 12 000 lignes.
  no-magic-numbers: 'off'
  max-lines: 'off'
  max-lines-per-function: 'off'
  complexity: 'off'
  camelcase: 'off'

  # ══════════════════════════════════════════════════════════════
  # CE QUI RESTE ACTIF — délibérément.
  # Ces règles couvrent des risques réels sur cette architecture :
  # une alerte de leur part est à corriger, pas à faire taire.
  # ══════════════════════════════════════════════════════════════
  # Règles NATIVES d'ESLint : aucun plugin à charger, donc elles
  # fonctionnent réellement chez Codacy.
  no-eval: 'error'
  no-implied-eval: 'error'
  no-new-func: 'error'
  no-script-url: 'error'
  no-prototype-builtins: 'error'

  # ── Pourquoi il n'y a PAS de règles security/* ici ────────────
  # La version précédente de ce fichier en déclarait quatre
  # (detect-eval-with-expression, detect-non-literal-require,
  # detect-unsafe-regex, detect-possible-timing-attacks) SANS
  # déclarer le plugin eslint-plugin-security qui les fournit.
  # Codacy ne pouvait pas les résoudre et remontait « Definition for
  # rule … was not found » sur la ligne 1 de CHAQUE fichier : 112
  # fausses alertes, et surtout quatre règles qui ne protégeaient
  # plus rien tout en donnant l'illusion du contraire.
  #
  # Les déclarer correctement demanderait d'ajouter eslint +
  # eslint-plugin-security aux dépendances de développement, pour
  # un dépôt dont la sobriété de dépendances est une règle affichée.
  # Ce qu'elles couvraient est repris ailleurs, plus solidement :
  #   - eval / require dynamique : couverts par les règles natives
  #     ci-dessus (no-eval, no-implied-eval, no-new-func) ;
  #   - comparaison à temps constant : la faille qu'elle avait
  #     trouvée dans pin.js est CORRIGÉE, et verrouillée par
  #     tests/security-hardening.test.js, qui échoue si une
  #     comparaison naïve d'empreinte réapparaît ou si
  #     timingSafeEqual reprend une sortie anticipée. Un test qui
  #     échoue vaut mieux qu'une règle qui ne se charge pas.
  no-unused-vars:
    - 'warn'
    - args: 'none'
      varsIgnorePattern: '^_'

overrides:
  # Scripts classiques (non-modules) : ils posent volontairement des
  # globales window.__* lues par les modules ES. Leurs fonctions de
  # premier niveau ne sont pas « inutilisées » — c'est ainsi qu'elles
  # sont exposées. (Rappel : getCardDesc a déjà été signalé à tort
  # comme mort pour cette raison exacte.)
  - files:
      - 'translations.js'
      - 'card-descriptions.js'
      - 'cloud-config.js'
      - 'sw.js'
    env:
      browser: true
      serviceworker: true
    parserOptions:
      sourceType: 'script'
    rules:
      no-unused-vars: 'off'
