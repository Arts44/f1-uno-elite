---
# ══════════════════════════════════════════════════════════════════
# CODACY — périmètre d'analyse
#
# Règle de la maison : on ne tord pas le code pour satisfaire un
# outil. Un faux positif se traite ici, par exclusion JUSTIFIÉE ; un
# vrai défaut se traite dans le code. Chaque ligne ci-dessous porte
# sa raison, pour que la décision reste défendable dans six mois.
#
# Ce qui reste analysé : les 12 000 lignes de modules applicatifs
# effectivement livrés au navigateur. C'est le seul périmètre où une
# alerte a une conséquence pour un utilisateur.
# ══════════════════════════════════════════════════════════════════

exclude_paths:
  # ── Artefact de build, jamais édité à la main ──────────────────
  # app.bundle.js est la sortie minifiée d'esbuild. Elle est
  # COMMITÉE (GitHub Pages ne construit rien) mais toute alerte la
  # concernant est un doublon de son source, illisible et non
  # corrigeable : on corrige app.js, pas le bundle.
  - 'app/app.bundle.js'
  - 'app/app.bundle.js.map'

  # ── Bibliothèque vendorisée, non modifiée ─────────────────────
  # qrcodegen.js est le QR encoder de Project Nayuki (MIT), copié
  # tel quel. Le modifier nous couperait de l'amont et n'est pas
  # notre travail. Il n'a qu'un point d'entrée (encodeText) et ne
  # touche ni au DOM, ni au réseau, ni au stockage.
  - 'app/qrcodegen.js'

  # ── Fichier généré ─────────────────────────────────────────────
  # data-embedded.js est produit par extract_data.mjs : une seule
  # affectation window.__F1UNO_EMBEDDED d'un littéral JSON. Le
  # corriger à la main serait écrasé à la prochaine génération.
  - 'app/data-embedded.js'

  # ── Outils de développement, jamais livrés au client ───────────
  # extract_*.mjs tournent sous Node à la main pour régénérer les
  # données ; capture_screenshots.py pilote Playwright pour les
  # captures du README. Aucun des trois n'atteint le navigateur d'un
  # utilisateur : leurs alertes (chemins en dur, littéraux, appels
  # système) n'ont pas de conséquence exploitable.
  - 'extract_data.mjs'
  - 'extract_circuits.mjs'
  - 'capture_screenshots.py'

  # ── Suite de tests ─────────────────────────────────────────────
  # tests/ existe pour ÊTRE du code d'assertion : littéraux
  # numériques en pagaille, expressions régulières construites,
  # charges XSS volontaires (tests/xss.test.js contient une vraie
  # charge — c'est le sujet du test). Analyser ces fichiers produit
  # du bruit par construction. Ils tournent en CI à chaque push.
  - 'tests/**'

  # ── Brouillons de travail, gitignorés ──────────────────────────
  # _*.html et _*.css sont des maquettes jetables (voir .gitignore).
  - '_*'

  # ── Documentation et données ───────────────────────────────────
  - 'docs/**'
  - 'app/data/**'
  - 'screenshots/**'
  - 'app/icons/**'
  - 'app/fonts/**'
  - 'node_modules/**'

# ══════════════════════════════════════════════════════════════════
# CE QUI EST FAIT CÔTÉ SERVICE — et pourquoi ce fichier ne suffit pas
#
# Codacy applique, EN PLUS d'ESLint, ses propres analyseurs (Opengrep,
# Trivy, PMD…). Ils ne lisent ni .eslintrc.yml ni les directives
# eslint-disable en ligne — ces directives ont même produit leur propre
# alerte ici, le plugin no-unsanitized n'étant pas installé côté
# service. Elles ont donc été retirées du code (i18n.js, render.js),
# leur justification conservée en commentaire simple.
#
# Ce fichier ne pilote PAS ces analyseurs. Les décisions ci-dessous
# sont appliquées dans Codacy même ; elles sont consignées ici pour
# rester défendables sans accès au service.
#
# État vérifié après application : 117 → 0 issues, sans qu'une seule
# ligne de code ait été tordue pour y arriver.
#
# ┌────────────────────────────────────────────────────────────────┐
# │ DEUX MÉCANIQUES, À NE PAS CONFONDRE                            │
# │                                                                │
# │ PATTERN DÉSACTIVÉ = décision STRUCTURELLE. La règle ne peut    │
# │   pas être satisfaite sans dénaturer le code, et elle vaut     │
# │   pour tout le dépôt, aujourd'hui et demain. On éteint la      │
# │   règle, et on met un TEST à sa place.                         │
# │                                                                │
# │ ISSUE MARQUÉE FAUX POSITIF = exception PONCTUELLE. La règle    │
# │   est bonne et doit rester armée ; c'est CETTE ligne-là qui    │
# │   est un cas particulier. On éteint l'occurrence, pas la       │
# │   règle.                                                       │
# │                                                                │
# │ Par défaut, préférer la seconde. Éteindre un détecteur de      │
# │ secrets parce qu'une clé publique le déclenche, c'est se       │
# │ priver de lui le jour où un VRAI secret sera commité.          │
# └────────────────────────────────────────────────────────────────┘
#
# ── A. PATTERNS DÉSACTIVÉS (structurel) ─────────────────────────
# Décochés dans le coding standard de l'organisation
# (« Default coding standard » #164497), puis appliqué au dépôt.
# Un pattern imposé par un standard NE PEUT PAS être décoché au
# niveau du dépôt : ni par l'interface du dépôt, ni par la CLI.
#
#   · « Avoid assigning user-controlled data to innerHTML »   (54)
#     Semgrep_javascript.browser.security.insecure-innerhtml…
#   · « Avoid Using Insecure Document Methods »               (54)
#     Semgrep_javascript.browser.security.insecure-document-method…
#       → Audit de provenance des 78 affectations innerHTML des
#         modules livrés : 40 markup CONSTANT du dépôt, 35 données
#         INTERNES versionnées, 3 données EXTERNES — ces trois-là
#         déjà échappées (import JSON → tEsc ; session cloud et
#         retours de feedback → escapeHtml). Le pattern ne sait pas
#         distinguer les trois cas et signale les 78.
#         Le satisfaire exigerait de reconstruire 78 fragments de
#         markup en createElement/textContent : des centaines de
#         lignes en remplacement de gabarits lisibles, pour zéro
#         gain réel. C'est la définition de « tordre le code ».
#       CE QUI REMPLACE LA RÈGLE : le test de provenance de
#         tests/security-hardening.test.js, qui ÉCHOUE si un site à
#         donnée externe perd son échappement.
#
#   · « SSRF by Validating User-Controlled URLs »              (2)
#     Semgrep_rules_lgpl_javascript_ssrf_rule-node-ssrf
#       → cfg.url vient d'un littéral de cloud-config.js, fichier
#         versionné servi avec l'app. Jamais d'une saisie, d'une
#         sauvegarde importée, d'un lien #backup= ni du réseau.
#         Provenance détaillée au-dessus de cloudConfig().
#
#   · « Avoid Innaccurate Numeric Literals »                   (2)
#     PMD_category_ecmascript_errorprone_InnaccurateNumericLiteral
#       → 86400000 a été REMPLACÉ par la constante DAY_MS — le
#         correctif que la règle appelle. Le pattern se déclenche
#         malgré tout, sur la ligne de la constante : il vise la
#         VALEUR, où qu'elle soit. Et 86400000 est exactement
#         représentable en double (2^7 × 675000) : il n'y a aucune
#         imprécision à corriger. Le refactor est CONSERVÉ, seule
#         l'alerte est éteinte.
#
#   · « Cryptographically Weak Random Number Generators »      (1)
#     Semgrep_rules_lgpl_javascript_crypto_rule-node-insecure-random…
#       → Un seul Math.random() dans tout le dépôt : la distance de
#         projection (34→60 px) des 12 particules de célébration
#         d'un badge. Le seul aléa qui compte utilise déjà un
#         CSPRNG — crypto.getRandomValues() dans secure-store.js,
#         pour le sel PBKDF2 et l'IV AES-GCM.
#       CE QUI REMPLACE LA RÈGLE : trois tests dans
#         tests/security-hardening.test.js — aucun Math.random()
#         dans secure-store.js / pin.js / cloud.js / backup.js,
#         ≥3 crypto.getRandomValues() dans secure-store.js, et un
#         seul Math.random() dans badges.js, justifié sur place.
#
# ── B. ISSUES MARQUÉES FAUX POSITIF (ponctuel) ──────────────────
# Les patterns ci-dessous restent ACTIFS. Seules ces occasions
# précises sont écartées, avec la raison écrite dans Codacy.
#
#   · cloud-config.js:23 — la clé « anon public » de Supabase
#     déclenche TROIS détecteurs de secret :
#       Semgrep_generic.secrets.gitleaks.jwt.jwt
#       Semgrep_generic.secrets.security.detected-jwt-token…
#       Trivy_secret
#     Cette clé est PUBLIQUE PAR CONCEPTION : servie à chaque
#     visiteur avec l'app (100 % cliente, aucun backend où la
#     cacher), elle n'autorise que ce que la Row Level Security
#     laisse passer côté serveur. Le token décodé porte
#     {"role":"anon"} — ce n'est PAS service_role, qui contournerait
#     RLS et n'a rien à faire dans un dépôt.
#     Les trois détecteurs restent ARMÉS : ils doivent continuer de
#     crier si un vrai secret est commité un jour.
#
#   · .github/workflows/keep-supabase-awake.yml:53 — LA MÊME clé anon,
#     en clair dans le workflow qui réveille Supabase. Elle y déclenche
#     les trois mêmes détecteurs. Elle est en clair DÉLIBÉRÉMENT : la
#     ranger dans les secrets du dépôt donnerait l'illusion qu'elle en
#     est un. La justification est écrite dans le workflow lui-même,
#     juste au-dessus de la ligne.
#
#   · cloud-auth.js:34 — « Avoid Hardcoded Passwords » sur
#     export const SESSION_KEY = 'f1uno_cloud_session';
#     C'est le NOM d'une clé localStorage, pas un mot de passe.
#     Le pattern reste ACTIF, pour la même raison.
#     ⚠️ CETTE LIGNE VIVAIT EN cloud.js:25 et son marquage y était fait.
#     Le découpage de cloud.js l'a déplacée, ce qui a ROUVERT l'issue —
#     un marquage est attaché à un emplacement, pas à une décision.
#     À reprendre après tout découpage qui déplace une ligne marquée.
#
#   · capture_seed.py:143 — « Possible hardcoded password:
#     'demo.access.token' ». Jeton FICTIF d'une session cloud inventée,
#     dans un script de capture qui ne tourne jamais chez un
#     utilisateur ; sa raison d'être est écrite deux lignes au-dessus
#     (empêcher getValidSession d'appeler le réseau pendant la capture).
#
#   · compare_captures.py:92 — « Detected subprocess function 'run'
#     without a static string ». shell=False et arguments en LISTE :
#     rien n'est interprété par un shell, et les deux éléments sont
#     sys.executable et un chemin construit depuis ROOT. Aucune donnée
#     externe n'entre dans la commande. Marqué NotExploitable, pas
#     FalsePositive : la règle a raison de regarder, c'est ce cas-ci
#     qui est sûr.
#
#   · db/01-tables.sql:1 et db/02-rls.sql:1 —
#     TSQLLint_set-quoted-identifier, « Expected SET QUOTED_IDENTIFIER
#     ON near top of file ». TSQLLint est un linter SQL SERVER ; db/
#     est du PostgreSQL pour Supabase, où cette instruction n'existe
#     pas — l'écrire casserait le script. Règle inapplicable par
#     construction.
#     CE QU'ON AURAIT PRÉFÉRÉ FAIRE, et pourquoi on ne l'a pas fait :
#     décocher le pattern, ou désactiver TSQLLint pour ce dépôt. Les
#     deux sont refusés par le service (« Pattern enforced by Default
#     coding standard, can't be modified » / Conflict), comme tous les
#     patterns du standard d'organisation. Le marquage occurrence par
#     occurrence est donc le SEUL levier disponible : il faudra le
#     refaire à chaque nouveau fichier .sql. C'est une dette connue,
#     pas un choix.
#     SQLint et SQLFluff restent ACTIFS sur db/ : c'est du SQL de
#     sécurité (RLS), on ne le sort pas du périmètre d'analyse.
#
# ── C. CE QU'ON NE DÉSACTIVE JAMAIS ─────────────────────────────
# eval, les fonctions construites depuis une chaîne, les URL
# javascript:, et les comparaisons d'empreintes. Une alerte de leur
# part est à CORRIGER, jamais à faire taire.
# Elles sont hors d'atteinte du coding standard par construction :
# Codacy affiche « ESLint · Config File: Applied · Overwritten by
# file », donc c'est .eslintrc.yml (no-eval, no-implied-eval,
# no-new-func, no-script-url) qui fait foi. La comparaison
# d'empreintes, elle, est tenue par tests/security-hardening.test.js
# — un test qui casse le build vaut mieux qu'une règle qu'un
# changement de configuration peut éteindre.

engines:
  eslint:
    enabled: true
    # La configuration fine (règles désactivées + justifications)
    # vit dans .eslintrc.yml, à côté du code qu'elle concerne.
    exclude_paths:
      - 'app/app.bundle.js'
      - 'app/qrcodegen.js'
      - 'app/data-embedded.js'
      - 'tests/**'
      - '_*'
  stylelint:
    enabled: true
  # Analyse Python : le seul fichier .py du dépôt est un outil de
  # capture d'écran hors runtime, déjà exclu ci-dessus.
  pylint:
    enabled: false
  bandit:
    enabled: false
