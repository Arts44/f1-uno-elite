---
# ══════════════════════════════════════════════════════════════════
# CODACY — périmètre d'analyse
#
# Règle de la maison : on ne tord pas le code pour satisfaire un
# outil. Un faux positif se traite ici, par exclusion JUSTIFIÉE ; un
# vrai défaut se traite dans le code. Chaque ligne ci-dessous porte
# sa raison, pour que la décision reste défendable dans six mois.
#
# Ce qui reste analysé : les 12 000 lignes de modules applicatifs
# effectivement livrés au navigateur. C'est le seul périmètre où une
# alerte a une conséquence pour un utilisateur.
# ══════════════════════════════════════════════════════════════════

exclude_paths:
  # ── Artefact de build, jamais édité à la main ──────────────────
  # app.bundle.js est la sortie minifiée d'esbuild. Elle est
  # COMMITÉE (GitHub Pages ne construit rien) mais toute alerte la
  # concernant est un doublon de son source, illisible et non
  # corrigeable : on corrige app.js, pas le bundle.
  - 'app.bundle.js'
  - 'app.bundle.js.map'

  # ── Bibliothèque vendorisée, non modifiée ─────────────────────
  # qrcodegen.js est le QR encoder de Project Nayuki (MIT), copié
  # tel quel. Le modifier nous couperait de l'amont et n'est pas
  # notre travail. Il n'a qu'un point d'entrée (encodeText) et ne
  # touche ni au DOM, ni au réseau, ni au stockage.
  - 'qrcodegen.js'

  # ── Fichier généré ─────────────────────────────────────────────
  # data-embedded.js est produit par extract_data.mjs : une seule
  # affectation window.__F1UNO_EMBEDDED d'un littéral JSON. Le
  # corriger à la main serait écrasé à la prochaine génération.
  - 'data-embedded.js'

  # ── Outils de développement, jamais livrés au client ───────────
  # extract_*.mjs tournent sous Node à la main pour régénérer les
  # données ; capture_screenshots.py pilote Playwright pour les
  # captures du README. Aucun des trois n'atteint le navigateur d'un
  # utilisateur : leurs alertes (chemins en dur, littéraux, appels
  # système) n'ont pas de conséquence exploitable.
  - 'extract_data.mjs'
  - 'extract_circuits.mjs'
  - 'capture_screenshots.py'

  # ── Suite de tests ─────────────────────────────────────────────
  # tests/ existe pour ÊTRE du code d'assertion : littéraux
  # numériques en pagaille, expressions régulières construites,
  # charges XSS volontaires (tests/xss.test.js contient une vraie
  # charge — c'est le sujet du test). Analyser ces fichiers produit
  # du bruit par construction. Ils tournent en CI à chaque push.
  - 'tests/**'

  # ── Brouillons de travail, gitignorés ──────────────────────────
  # _*.html et _*.css sont des maquettes jetables (voir .gitignore).
  - '_*'

  # ── Documentation et données ───────────────────────────────────
  - 'docs/**'
  - 'data/**'
  - 'screenshots/**'
  - 'icons/**'
  - 'fonts/**'
  - 'node_modules/**'

# ══════════════════════════════════════════════════════════════════
# PATTERNS NATIFS CODACY — ce fichier ne peut PAS les désactiver.
#
# Codacy applique, en plus d'ESLint, ses propres patterns. Ils ne
# lisent ni .eslintrc.yml ni les directives eslint-disable en ligne :
# ces directives ont même produit leur propre alerte ici, le plugin
# no-unsanitized n'étant pas installé côté service. Elles ont donc été
# retirées du code (i18n.js, render.js), leur justification conservée
# en commentaire simple.
#
# Les quatre patterns ci-dessous se désactivent UNIQUEMENT dans
# l'interface : Repository → Settings → Code patterns. La raison est
# consignée ici pour que la décision reste défendable sans accès au
# service :
#
#   · « Avoid assigning user-controlled data to innerHTML » (55×)
#   · « Avoid Using Insecure Document Methods » (55×)
#       → Un audit de provenance des 78 affectations innerHTML des
#         modules livrés donne : 40 markup CONSTANT du dépôt,
#         35 données INTERNES versionnées, 3 données EXTERNES, toutes
#         les trois déjà échappées (import JSON → tEsc, session cloud
#         et retours de feedback → escapeHtml). Le pattern ne sait pas
#         distinguer les trois cas et signale les 78.
#         CE QUI REMPLACE LE PATTERN : le test de provenance de
#         tests/security-hardening.test.js, qui ÉCHOUE si un site à
#         donnée externe perd son échappement. Un test qui casse le
#         build vaut mieux qu'une alerte qu'on apprend à ignorer.
#
#   · « Hardcoded JWT » sur cloud-config.js:23
#       → C'est la clé « anon public » de Supabase, publique par
#         conception et protégée par Row Level Security côté serveur.
#         Décodage du token : {"role":"anon"} — vérifié, ce n'est PAS
#         service_role. Une app 100 % cliente ne peut pas la cacher.
#
#   · « Server-Side Request Forgery » sur cloud.js (fetch vers cfg.url)
#       → cfg.url provient d'un littéral de cloud-config.js, fichier
#         versionné et servi avec l'app. Jamais d'une saisie, d'une
#         sauvegarde importée, d'un lien #backup= ni du réseau.
#         Provenance détaillée au-dessus de cloudConfig().
#
#   · « Inaccurate / magic numeric literal » sur 86400000 (2×)
#       → backup.js et badges.js. Le nombre a été REMPLACÉ par une
#         constante nommée DAY_MS — le correctif que la règle appelle.
#         Le pattern se déclenche malgré tout, sur la ligne de la
#         constante elle-même : il vise la VALEUR, où qu'elle soit, et
#         aucune écriture ne peut le satisfaire. 86400000 est
#         exactement représentable en double (2^7 × 675000), il n'y a
#         donc aucune perte de précision à corriger.
#         Le refactor est CONSERVÉ : le nombre magique a disparu du
#         code, ce qui était le vrai objectif. Seule l'alerte est
#         désactivée, pas l'amélioration.
#
#   · « Insecure random / cryptographically weak RNG » sur badges.js
#       → Un seul Math.random() dans tout le dépôt : la distance de
#         projection (34→60 px) des 12 particules de célébration
#         affichées quand un badge se débloque. Aucune valeur de
#         sécurité n'en dépend.
#         Le seul aléa qui compte, lui, utilise déjà un CSPRNG :
#         crypto.getRandomValues() dans secure-store.js, pour le sel
#         PBKDF2 et l'IV AES-GCM. Un test doit échouer si un
#         Math.random() apparaît un jour dans secure-store.js — c'est
#         là qu'il serait grave, pas dans des confettis.
#
# NON DÉSACTIVÉ, délibérément : tout ce qui touche eval, les fonctions
# construites depuis une chaîne, les URL javascript:, et les
# comparaisons d'empreintes. Ces alertes-là sont à corriger.

engines:
  eslint:
    enabled: true
    # La configuration fine (règles désactivées + justifications)
    # vit dans .eslintrc.yml, à côté du code qu'elle concerne.
    exclude_paths:
      - 'app.bundle.js'
      - 'qrcodegen.js'
      - 'data-embedded.js'
      - 'tests/**'
      - '_*'
  stylelint:
    enabled: true
  # Analyse Python : le seul fichier .py du dépôt est un outil de
  # capture d'écran hors runtime, déjà exclu ci-dessus.
  pylint:
    enabled: false
  bandit:
    enabled: false
