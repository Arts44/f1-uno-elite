<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="app.title">F1 UNO Élite — Collection</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8002D">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script>(function(){try{var e=document.documentElement;var t=localStorage.getItem('f1uno_theme');if(t)e.setAttribute('data-theme',t);var F={circuit:["'Space Grotesk',sans-serif","'Inter',sans-serif"],sprint:["'Chakra Petch',sans-serif","'IBM Plex Sans',sans-serif"],prestige:["'Fraunces',serif","'Source Sans 3',sans-serif"],minimal:["'Manrope',sans-serif","'Manrope',sans-serif"],original:["'Syne',sans-serif","'DM Sans',sans-serif"]};var f=localStorage.getItem('f1uno_font')||'circuit';e.setAttribute('data-font',f);var v=F[f];if(v){e.style.setProperty('--font-d',v[0]);e.style.setProperty('--font-b',v[1]);}/* Boot target decided HERE, before the first paint: the bundle loads at the end of <body>, so leaving the login screen visible by default made it flash for ~0.5s whenever the PIN was off (and inverting the defaults would only move the flash to the PIN-on case). */var done=localStorage.getItem('f1uno_setup_done')==='true';var pin=localStorage.getItem('f1uno_pin_enabled')==='true';e.setAttribute('data-boot',(!done||pin)?'login':'app');}catch(e){e&&e.message;document.documentElement.setAttribute('data-boot','login');}})();</script>
</head>
<body>
  <!-- Tracé partagé du casque C1 (1 symbol, 61 <use>) — colorisé par variables --helm-* -->
  <svg style="display:none" aria-hidden="true"><symbol id="icHelmC1" viewBox="0 0 120 120">
    <path fill="var(--helm-shell,#888)" d="M20 76c-3-11-2-24 4-34C32 28 47 20 64 20c17 0 31 8 37 21 4 9 4 19 1 28l-3 9c-2 6-7 9-14 10l-46 3c-8 1-14-3-17-10Z"/>
    <path fill="var(--helm-visor,#333)" d="M35 51c2-8 9-13 18-13l37 1c7 0 11 5 10 12l-3 14c-2 7-7 11-15 11l-35 1c-9 0-13-5-12-13Z"/>
    <path fill="var(--helm-det,#eee)" opacity=".85" d="M58 20c8-.5 16 .5 23 4l-3 6c-6-3-12-4-19-3Z"/>
    <path fill="var(--helm-lip,#222)" d="M28 84l52-3-1 7-49 3Z"/>
  </symbol></svg>
<!-- LOGIN SCREEN -->
<div id="login-screen" role="dialog" aria-label="" data-i18n-aria="login.screen" aria-modal="true">
  <div class="login-box">
    <span class="lockup lk-lg" aria-label="F1 UNO Élite"><span class="lk-top"><span class="lk-f1">F1</span><span class="lk-uno">UNO</span><span class="lk-elite">Élite</span></span><span class="lk-bar" aria-hidden="true"></span></span>
    <button class="theme-switch" id="loginThemeSwitch" type="button" aria-label="" data-i18n-aria="theme.toggle" data-action="toggleTheme">
      <span class="theme-icon" id="loginThemeIcon" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
    </button>
    <svg class="pin-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <label class="pin-label" for="pin-keypad" data-i18n="login.pin">PIN Code</label>
    <div class="otp-wrap pin-segs" id="pin-segs" role="status" aria-live="polite" aria-label="" data-i18n-aria="login.pin_input">
      <div class="otp-boxes" aria-hidden="true"><span class="otp-box"><span class="otp-caret"></span></span><span class="otp-box"><span class="otp-caret"></span></span><span class="otp-box"><span class="otp-caret"></span></span><span class="otp-box"><span class="otp-caret"></span></span></div>
    </div>
    <div class="pin-keypad" id="pin-keypad" role="group" aria-label="Clavier numérique">
      <button class="pin-key" data-digit="1" type="button">1</button>
      <button class="pin-key" data-digit="2" type="button">2</button>
      <button class="pin-key" data-digit="3" type="button">3</button>
      <button class="pin-key" data-digit="4" type="button">4</button>
      <button class="pin-key" data-digit="5" type="button">5</button>
      <button class="pin-key" data-digit="6" type="button">6</button>
      <button class="pin-key" data-digit="7" type="button">7</button>
      <button class="pin-key" data-digit="8" type="button">8</button>
      <button class="pin-key" data-digit="9" type="button">9</button>
      <button class="pin-key del" data-action="pinDel" type="button" aria-label="" data-i18n-aria="login.delete">⌫</button>
      <button class="pin-key zero" data-digit="0" type="button">0</button>
    </div>
    <div class="pin-error-msg" id="pin-error" role="alert" aria-live="assertive"></div>
    <button class="viewer-browse-btn" id="viewerBrowseBtn" type="button" style="display:none" data-i18n="login.browse">👁 Parcourir</button>
  </div>
</div>
<input type="file" id="importFileInput" accept=".json" style="display:none">

<div class="bga bga1" aria-hidden="true"></div><div class="bga bga2" aria-hidden="true"></div>


<!-- HEADER -->
<header class="header" role="banner">
  <div class="header-inner">
    <div class="header-left">
      <a class="logo" href="#" aria-label="" data-i18n-aria="app.home">
        <span class="lockup lk-hd" aria-label="F1 UNO Élite"><span class="lk-top"><span class="lk-f1">F1</span><span class="lk-uno">UNO</span><span class="lk-elite">Élite</span></span><span class="lk-bar" aria-hidden="true"></span></span>
      </a>
    </div>
    <div class="header-right">
      <div class="header-title" id="headerTitle"></div>
      <div class="season-pills" id="seasonPills" role="tablist" aria-label="Sélection de saison"></div>
      <span class="header-divider" aria-hidden="true"></span>
      <div class="header-count" id="totalCount" aria-label="" data-i18n-aria="header.total_aria">0</div>
    </div>
  </div>
  <div class="header-progress" aria-hidden="true"><div class="header-progress-bar" id="headerProgressBar"></div></div>
</header>

<!-- APP -->
<div class="app" id="app-wrapper">
  <main class="main" id="collectionView" role="tabpanel" aria-label="Collection de cartes">
    <div class="sort-row"><div class="sort-seg" role="group" aria-label="Tri" data-i18n-aria="sort.label">
      <button class="seg-opt" id="sortNum" type="button" data-action="setSort" data-sort="num" data-i18n="sort.num">N° de carte</button>
      <button class="seg-opt" id="sortMissing" type="button" data-action="setSort" data-sort="missing" data-i18n="sort.missing">Manquantes d’abord</button>
    </div></div>
    <div class="card-grid" id="cardGrid" role="list" aria-label="Grille de cartes"></div>
  </main>
  <section class="badges-view" id="badgesView" role="tabpanel" aria-label="" data-i18n-aria="b.view">
    <div class="badges-hero" id="badgesHero"></div>
    <div class="badges-next" id="badgesNext"></div>
    <div id="badgesFams"></div>
  </section>
  <section class="stats-view" id="statsView" role="tabpanel" aria-label="" data-i18n-aria="st.view"></section>
  <section class="settings-view" id="accountView" role="tabpanel" aria-label="" data-i18n-aria="acc.view"></section>
  <section class="settings-view" id="settingsView" role="tabpanel" aria-label="" data-i18n-aria="s.view"></section>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav" id="bottomNav" role="navigation" aria-label="" data-i18n-aria="nav.main">
  <div class="bead-nav-inner" id="beadInner">
    <svg class="bead-bar" id="beadBar" aria-hidden="true"></svg>
    <div class="bead" id="navBead" aria-hidden="true"></div>
    <div class="bottom-nav-pill" role="tablist">
      <button class="bn-tab active" data-action="switchView" data-view="collection" type="button">
      <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
      <span class="bn-label" data-i18n="nav.collection">Collection</span>
    </button>
      <button class="bn-tab" data-action="switchView" data-view="badges" type="button">
      <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
      <span class="bn-label" data-i18n="nav.badges">Badges</span>
    </button>
      <button class="bn-tab" data-action="switchView" data-view="stats" type="button">
      <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      <span class="bn-label" data-i18n="nav.stats">Stats</span>
    </button>
      <button class="bn-tab" data-action="switchView" data-view="account" type="button">
      <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="bn-label" data-i18n="nav.account">Account</span>
    </button>
      <button class="bn-tab" data-action="switchView" data-view="settings" type="button">
      <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M2 14h4"/><path d="M10 8h4"/><path d="M18 16h4"/></svg>
      <span class="bn-label" data-i18n="nav.settings">Settings</span>
    </button>
    </div>
  </div>
</nav>

<!-- MODAL -->
<div class="mo" id="mo" role="dialog" aria-modal="true" aria-label="" data-i18n-aria="m.modal">
  <div class="modal">
    <div class="modal-visual tv-blue" id="moVis">
      <button class="modal-close" id="modalCloseBtn" type="button" aria-label="" data-i18n-aria="m.close">✕</button>
      <div id="moEmoji" aria-hidden="true"></div>
    </div>
    <div class="modal-body">
      <div class="mo-num" id="moNum"></div>
      <div class="mo-name" id="moName"></div>
      <div class="mo-team" id="moTeam"></div>
      <div class="mo-rarity" id="moRarity"></div>
      <div class="mo-status" id="moStatus"></div>
      <div class="mo-info-row" id="moInfo"></div>
      <div class="mo-desc" id="moDesc"></div>
      <div class="mo-tags" id="moTags"></div>
      <div class="mo-variants-title" data-i18n="m.copies">My copies by type</div>
      <div class="mo-type-rows" id="moTypeRows" role="list" aria-label="" data-i18n-aria="m.types_list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data-embedded.js"></script>
<script src="translations.js"></script>
<script src="cloud-config.js"></script>
<script src="card-descriptions.js"></script>
<script src="app.bundle.js"></script>
</body>
</html>
